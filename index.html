<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form>
            <label for="player-1-name">Player 1</label>
            <input id="player-1-name" name="player-1-name" type="text">

            <label for="player-2-name">Player 2</label>
            <input id="player-2-name" name="player-2-name" type="text">

            <input type="submit">
        </form>
        <div class="text-container">     
        </div>
        <button class="reset-button">Reset</button>
    </div>
    <div class="game-board">
        <div class="r1c1" id="0"></div>
        <div class="r1c2" id="1"></div>
        <div class="r1c3" id="2"></div>
        <div class="r2c1" id="3"></div>
        <div class="r2c2" id="4"></div>
        <div class="r2c3" id="5"></div>
        <div class="r3c1" id="6"></div>
        <div class="r3c2" id="7"></div>
        <div class="r3c3" id="8"></div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
